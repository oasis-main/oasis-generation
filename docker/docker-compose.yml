# Local dev: gateway only, proxying to Docker Model Runner on the host
# (enable a model first: `docker model pull hf.co/unsloth/gemma-4-12b-it-gguf:Q4_K_M`).
#
#   docker compose -f docker/docker-compose.yml up gateway
#
# Cloud/GPU: `--profile gpu` adds the vLLM runner and points the gateway at it.
services:
  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
    restart: unless-stopped  # fleet dependency: Nimbus's oasis-generation provider
    # Defensive cap only — the gateway is a ~100 MB proxy, NOT the memory user.
    # The 12 GB hog is Docker Model Runner (llama.cpp on the host, Metal), which
    # is not a container and cannot be mem_limited here. memswap_limit == mem_limit
    # forbids this container from touching swap (guards against a swap spiral).
    mem_limit: 512m
    memswap_limit: 512m
    ports:
      - "8800:8800"
    # Secrets (service tokens + the Bedrock/oasis-dev AWS key) come from
    # docker/.env via env_file — NOT `environment: ${VAR:-}` interpolation,
    # which lets an empty shell export silently shadow the file (the mistake
    # oasis-claw hit with Anthropic auth). env_file always wins.
    env_file:
      - path: .env
        required: false
    environment:
      # Non-secret knobs only.
      OASIS_GENERATION_UPSTREAM_BASE_URL: ${OASIS_GENERATION_UPSTREAM_BASE_URL:-http://model-runner.docker.internal/engines/llama.cpp/v1}
      # Bedrock backend (GEN-003). Credentials themselves come from env_file
      # (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY); this is just the region.
      OASIS_GENERATION_BEDROCK_REGION: ${OASIS_GENERATION_BEDROCK_REGION:-us-east-1}

  runner:
    profiles: ["gpu"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.runner
    volumes:
      - ../models:/models   # gitignored; block-volume mount in the cloud
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
