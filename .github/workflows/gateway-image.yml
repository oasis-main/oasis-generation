# Builds the gateway image for linux/amd64 (the Hetzner VM, GEN-008) and
# publishes it to GHCR. The VM pulls it by digest; the digest is in the job
# summary. Actions are pinned by commit SHA, not by tag.
name: gateway-image

on:
  push:
    branches: [dev]
    paths:
      - "src/**"
      - "docker/Dockerfile.gateway"
      - "docker/requirements-gateway.lock"
      - ".github/workflows/gateway-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write        # push to ghcr.io/oasis-main
      id-token: write        # build provenance
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/oasis-generation-gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.gateway
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:dev

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Gateway image"
            echo
            echo "Pin this in hetzner-gateway \`gateway_image\`:"
            echo
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "Built from \`${GITHUB_SHA}\`."
          } >> "$GITHUB_STEP_SUMMARY"
